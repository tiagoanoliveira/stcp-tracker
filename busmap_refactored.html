<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mapa em tempo real dos autocarros STCP no Porto">
  <title>STCP Tracker - Mapa de Autocarros</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS da aplicação -->
  <link rel="stylesheet" href="./src/ui/styles/busmap.css">
</head>
<body>
  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Header overlay transparente com botões opacos -->
  <div class="header-overlay">
    <div id="last-update-time" class="header-timestamp">
      Última atualização: <strong>--:--:--</strong>
    </div>
    <button id="center-user" class="header-btn" title="Centrar no utilizador">
      <span class="header-btn-icon">📍</span>
      Centrar
    </button>
    <button id="refresh-now" class="header-btn header-btn-primary" title="Forçar atualização">
      <span class="header-btn-icon">🔄</span>
      Atualizar
    </button>
  </div>

  <!-- Mensagem de erro -->
  <div id="error-message" class="error-overlay"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Nossa aplicação refatorizada -->
  <script type="module" src="./src/pages/BusMapApp.js"></script>
</body>
</html>
