<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de linhas STCP no Porto">
  <meta name="theme-color" content="#0072c6">
  <title>Linhas STCP</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="shortcut icon" href="./resources/favicon.svg">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BYVRR1K1R2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BYVRR1K1R2');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f2f4f7;
      color: #1a1a2e;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 680px;
      margin: 0 auto;
      background: #f2f4f7;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e5e8ee;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0072c6;
      font-weight: 600;
      font-size: 14px;
      flex-shrink: 0;
    }
    .header-logo img { height: 26px; width: auto; }
    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    /* spacer so title stays centered */
    .header-spacer { width: 80px; flex-shrink: 0; }

    /* ── Search ── */
    .search-wrap {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e8ee;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #f2f4f7;
      border: 1.5px solid #e2e5ec;
      border-radius: 10px;
      padding: 0 12px;
      gap: 8px;
      height: 44px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-box:focus-within {
      border-color: #0072c6;
      box-shadow: 0 0 0 3px rgba(0,114,198,.1);
      background: #fff;
    }
    .search-icon { width: 17px; height: 17px; color: #9ba4b4; flex-shrink: 0; }
    .search-input {
      flex: 1; border: none; background: transparent;
      font-size: 15px; color: #1a1a2e; outline: none; min-width: 0;
    }
    .search-input::placeholder { color: #9ba4b4; }
    .search-clear {
      display: none; align-items: center; justify-content: center;
      width: 24px; height: 24px; border: none; background: none;
      cursor: pointer; color: #9ba4b4; flex-shrink: 0;
      border-radius: 50%; transition: background .15s, color .15s;
    }
    .search-clear:hover { background: #e5e8ee; color: #333; }
    .search-clear svg { width: 13px; height: 13px; }

    /* ── List ── */
    .lines-list {
      flex: 1;
      list-style: none;
      margin-top: 8px;
    }
    .line-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      height: 62px;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border-bottom: 1px solid #f0f2f6;
      transition: background .13s;
      cursor: pointer;
    }
    .line-item:first-child { border-top: 1px solid #f0f2f6; }
    .line-item:hover { background: #f5f8ff; }
    .line-item:active { background: #eaf1fb; }

    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 54px;
      height: 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      padding: 0 8px;
      flex-shrink: 0;
      letter-spacing: .01em;
    }
    .line-name {
      flex: 1;
      font-size: 15px;
      font-weight: 400;
      color: #1a1a2e;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .arrow { width: 16px; height: 16px; color: #c8cdd8; flex-shrink: 0; }

    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #9ba4b4;
      font-size: 15px;
      list-style: none;
    }

    /* ── Spinner ── */
    .spinner-wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; padding: 56px 20px;
      color: #9ba4b4; font-size: 14px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e5e8ee;
      border-top-color: #0072c6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 24px 16px 16px;
      font-size: 13px;
      color: #9ba4b4;
    }
    .footer a { color: #0072c6; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .header-title { font-size: 16px; }
      .line-item { padding: 0 12px; gap: 10px; }
      .badge { min-width: 46px; height: 28px; font-size: 13px; }
      .line-name { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="/" class="header-logo" title="Voltar ao mapa">
        <img src="./resources/favicon.svg" alt="STCP Live">
        <span>STCP Live</span>
      </a>
      <h1 class="header-title">Linhas STCP</h1>
      <div class="header-spacer"></div>
    </header>

    <div class="search-wrap">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input id="search" type="text" class="search-input" placeholder="Procurar linha (número ou nome)" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="search-clear" class="search-clear" aria-label="Limpar">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <main>
      <ul id="list" class="lines-list" role="list" aria-label="Lista de linhas STCP"></ul>
    </main>

    <footer class="footer">
      &copy; 2026 STCP Live Map &bull; Website feito com &#x1F90D; por
      <a href="https://www.tiagoanoliveira.pt/" target="_blank" rel="noopener noreferrer">Tiago Oliveira</a>
    </footer>
  </div>

  <script>
    const PROXY = 'https://stcp-worker.tiagoanoliveira.pt';
    const listEl  = document.getElementById('list');
    const searchEl = document.getElementById('search');
    const clearEl  = document.getElementById('search-clear');
    let allRoutes = [];

    function renderList(routes) {
      if (!routes.length) {
        listEl.innerHTML = '<li class="empty">Nenhuma linha encontrada.</li>';
        return;
      }
      listEl.innerHTML = routes.map(r => {
        const bg = r.color || '#187EC2';
        const fg = r.text_color || '#FFFFFF';
        return `
          <a href="line-detail.html?id=${encodeURIComponent(r.id)}&number=${encodeURIComponent(r.number)}"
             class="line-item" role="listitem"
             aria-label="Linha ${r.number}: ${r.name}">
            <span class="badge" style="background:${bg};color:${fg}">${r.number}</span>
            <span class="line-name">${r.name}</span>
            <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </a>`;
      }).join('');
    }

    async function load() {
      listEl.innerHTML = '<li class="spinner-wrap" style="list-style:none"><div class="spinner"></div><span>A carregar linhas&hellip;</span></li>';
      try {
        const res  = await fetch(`${PROXY}/routes/list`);
        const data = await res.json();
        allRoutes  = data.routes || [];
        renderList(allRoutes);
      } catch (e) {
        listEl.innerHTML = '<li class="empty">Erro ao carregar linhas. Tenta mais tarde.</li>';
      }
    }

    searchEl.addEventListener('input', () => {
      const q = searchEl.value;
      clearEl.style.display = q ? 'flex' : 'none';
      const lq = q.trim().toLowerCase();
      renderList(lq
        ? allRoutes.filter(r => r.number.toLowerCase().includes(lq) || r.name.toLowerCase().includes(lq))
        : allRoutes
      );
    });

    clearEl.addEventListener('click', () => {
      searchEl.value = '';
      clearEl.style.display = 'none';
      renderList(allRoutes);
      searchEl.focus();
    });

    load();
  </script>
</body>
</html>
