<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mapa de paragens STCP no Porto">
  <meta name="theme-color" content="#0072c6">
  <title>STCP Tracker - Mapa de Paragens</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS da aplicação -->
  <link rel="stylesheet" href="./src/ui/styles/busmap.css">
  <link rel="stylesheet" href="./src/ui/styles/stopsmap.css">
  <link rel="stylesheet" href="./src/ui/styles/stopDetail.css">
  <link rel="stylesheet" href="./src/ui/styles/loading.css">
  <link rel="stylesheet" href="./src/ui/styles/routeFilterBar.css">
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="./resources/favicon.svg">
</head>
<body>
  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Logo no canto superior esquerdo (link para home) -->
  <a href="/" class="logo-overlay" title="Ir para o início">
    <img src="./resources/favicon.svg" alt="STCP Live Map Logo">
    <span class="logo-text">Paragens STCP</span>
  </a>

  <!-- Barra de pesquisa + filtro de linhas -->
  <div class="search-overlay">
    <div class="search-input-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input 
        type="text" 
        id="stop-search" 
        class="search-input" 
        placeholder="Pesquisar paragem por nome ou código..."
        autocomplete="off"
      />
      <!-- Botão de limpar pesquisa -->
      <button id="search-clear" class="search-clear-btn" title="Limpar pesquisa" aria-label="Limpar pesquisa">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <!-- Barra de filtro de linhas (imediatamente abaixo da pesquisa) -->
    <div id="route-filter-bar"></div>
  </div>

  <!-- Rodapé no fundo centro -->
  <div class="footer-overlay">
    &copy; 2026 STCP Live Map • Website feito com 🤍 por <a href="https://www.tiagoanoliveira.pt/" target="_blank">Tiago Oliveira</a>. Dificuldades ou sugestões?
    <a href="https://tiagoanoliveira.pt/support/a260e7bee11b401b9fd09290e8a8d6d9">Clica aqui.</a>
  </div>

  <!-- Mensagem de erro -->
  <div id="error-message" class="error-overlay"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Nossa aplicação -->
  <script type="module" src="./src/pages/StopsMapApp.js"></script>
</body>
</html>
