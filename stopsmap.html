<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mapa de paragens STCP no Porto">
  <meta name="theme-color" content="#0072c6">
  <title>STCP Tracker - Mapa de Paragens</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- CSS da aplicação (busmap.css como base) -->
  <link rel="stylesheet" href="./src/ui/styles/busmap.css">
  <link rel="stylesheet" href="./src/ui/styles/stopsmap.css">
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="./resources/favicon.svg">
</head>
<body>
  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Logo no canto superior esquerdo -->
  <div class="logo-overlay">
    <img src="./resources/favicon.svg" alt="STCP Live Map Logo">
    <span class="logo-text">Paragens STCP</span>
  </div>

  <!-- Header menu no topo centro -->
  <div class="header-overlay">
    <div id="last-update-time" class="header-timestamp">
      Última atualização: <strong>--:--:--</strong>
    </div>
    <button id="refresh-now" class="header-btn" title="Atualizar dados">
      <img src="./resources/atualizar.png" alt="Atualizar">
    </button>
  </div>

  <!-- Barra de pesquisa - abaixo do logo, centrada -->
  <div class="search-overlay">
    <div class="search-input-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input 
        type="text" 
        id="stop-search" 
        class="search-input" 
        placeholder="Pesquisar paragem por nome ou código..."
        autocomplete="off"
      />
    </div>
  </div>

  <!-- Rodapé no fundo centro -->
  <div class="footer-overlay">
    &copy; 2026 STCP Live Map • Website feito com 🤍 por <a href="https://www.linkedin.com/in/tiagoalexoliveira/" target="_blank">Tiago Oliveira</a>. Todos os direitos reservados.
  </div>

  <!-- Mensagem de erro -->
  <div id="error-message" class="error-overlay"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Nossa aplicação refatorizada -->
  <script type="module" src="./src/pages/StopsMapApp.js"></script>
</body>
</html>
