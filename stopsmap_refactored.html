<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STCP Tracker - Mapa de Paragens</title>
  <link rel="shortcut icon" href="./resources/favicon.svg">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- StopsMap CSS (mesmo estilo do BusMap) -->
  <link rel="stylesheet" href="./src/ui/styles/stopsmap.css" />
</head>
<body>
  <!-- Logo no canto superior esquerdo -->
  <div class="logo-overlay">
    <img src="./resources/logo_stcp.svg" alt="STCP Logo" />
    <span class="logo-text">Mapa de Paragens</span>
  </div>

  <!-- Barra de pesquisa centrada -->
  <div class="search-overlay">
    <div class="search-input-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input 
        type="text" 
        id="stop-search" 
        class="search-input" 
        placeholder="Pesquisar paragem por nome ou código..."
        autocomplete="off"
      />
    </div>
    <button id="search-stop" class="search-btn" title="Pesquisar">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
    </button>
    <button id="center-user-stops" class="center-btn" title="Centrar na minha localização">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <!-- Menu de navegação -->
  <div class="nav-overlay">
    <a href="busmap_refactored.html" class="nav-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="6" width="18" height="12" rx="2"/>
        <path d="M7 10h.01M12 10h.01M17 10h.01"/>
      </svg>
      Ver Autocarros
    </a>
  </div>

  <!-- Mensagem de erro (escondida por padrão) -->
  <div id="error-message" class="error-overlay"></div>

  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Rodapé -->
  <div class="footer-overlay">
    &copy; 2025 STCP Tracker • Website feito com 🤍 por <a href="https://www.linkedin.com/in/tiagoalexoliveira/" target="_blank">Tiago Oliveira</a>. Todos os direitos reservados.
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Nossa aplicação refatorizada -->
  <script type="module" src="./src/pages/StopsMapApp.js"></script>
</body>
</html>
