# Wrangler configuration for STCP API Proxy Worker

name = "porto-live"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker settings
workers_dev = true

# Custom Domain Routes
[[routes]]
pattern = "porto-live.tiagoanoliveira.pt/*"
zone_name = "tiagoanoliveira.pt"

[[d1_databases]]
binding = "DB"
database_name = "79ac42f9-fb09-4509-99e2-ce3a0fa9bbb2"
database_id = "79ac42f9-fb09-4509-99e2-ce3a0fa9bbb2"

# Deploy commands:
# npx wrangler deploy                    # Deploy to production
# npx wrangler dev                       # Run locally
# npx wrangler tail                      # View logs
# npx wrangler publish --dry-run         # Test deploy without publishing
