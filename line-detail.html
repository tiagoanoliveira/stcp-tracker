<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhe de linha STCP">
  <meta name="theme-color" content="#0072c6">
  <title>Linha STCP</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="shortcut icon" href="./resources/icons/favicon.svg">
  <link rel="stylesheet" href="./src/ui/styles/lines.css">
  <link rel="stylesheet" href="./src/ui/styles/bottom-nav.css">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BYVRR1K1R2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BYVRR1K1R2');
  </script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="/lines.html" class="back-btn" id="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Todas as linhas
      </a>
    </header>

    <div class="hero" id="hero">
      <div class="hero-top">
        <span class="hero-badge" id="hero-badge">&hellip;</span>
        <span class="hero-name" id="hero-name"></span>
      </div>
      <div class="hero-actions">
        <button class="hero-btn" id="btn-invert">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4 4 4"/><path d="M17 8v12m0 0 4-4m-4 4-4-4"/>
          </svg>
          Inverter sentido
        </button>
        <button class="hero-btn" id="btn-map">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/>
          </svg>
          Ver no Mapa
        </button>
      </div>
    </div>

    <div id="state-loading" class="state">
      <div class="spinner"></div>
      <span>A carregar paragens&hellip;</span>
    </div>
    <div id="state-error" class="state" style="display:none">
      <svg class="err-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16.5" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="err-msg" id="err-msg">Erro ao carregar paragens.</span>
    </div>

    <ul id="stops" class="stops" style="display:none" aria-label="Paragens da linha"></ul>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a class="bottom-nav-item" href="/" title="Mapa de Autocarros">
        <img src="./resources/icons/busmap.png" alt="" aria-hidden="true">
        <span>Autocarros</span>
      </a>
      <a class="bottom-nav-item" href="stopsmap" title="Mapa de Paragens">
        <img src="./resources/icons/paragem.png" alt="" aria-hidden="true">
        <span>Paragens</span>
      </a>
      <a class="bottom-nav-item active" href="lines" title="Linhas STCP">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="10" r="5" fill="currentColor" stroke="none"/>
          <circle cx="38" cy="18" r="5" fill="currentColor" stroke="none"/>
          <circle cx="20" cy="25" r="5" fill="currentColor" stroke="none"/>
          <circle cx="38" cy="38" r="5" fill="currentColor" stroke="none"/>
          <path d="M10 10 C30 10 38 10 38 18 C38 26 10 22 10 30 C0 38 38 38 38 38" fill="none"/>
        </svg>
        <span>Linhas</span>
      </a>
      <a class="bottom-nav-item" href="favourites" title="Favoritos">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span>Favoritos</span>
      </a>
      <a class="bottom-nav-item" href="settings" title="Definições">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Definições</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/src/pages/LineDetailApp.js"></script>
</body>
</html>
