<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhe de linha STCP">
  <meta name="theme-color" content="#0072c6">
  <title>Linha STCP</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./src/ui/styles/lines.css">
  <link rel="shortcut icon" href="./resources/favicon.svg">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BYVRR1K1R2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BYVRR1K1R2');
  </script>
</head>
<body>
  <div class="lines-app">
    <header class="lines-header" id="line-detail-header">
      <a href="/lines" class="lines-back-btn" title="Todas as linhas">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>Todas as linhas</span>
      </a>
      <h1 class="lines-title" id="detail-page-title">Linha</h1>
    </header>

    <div class="line-detail-hero" id="line-detail-hero">
      <div class="line-detail-badge" id="line-detail-badge"></div>
      <div class="line-detail-info">
        <div class="line-detail-name" id="line-detail-name"></div>
        <div class="line-detail-actions">
          <button class="line-detail-action-btn" id="btn-invert" title="Inverter sentido">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4m0 0L3 8m4-4 4 4"/><path d="M17 8v12m0 0 4-4m-4 4-4-4"/>
            </svg>
            Inverter sentido
          </button>
          <a class="line-detail-action-btn" id="btn-map" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/>
            </svg>
            Ver no Mapa
          </a>
        </div>
      </div>
    </div>

    <div id="line-detail-loading" class="lines-loading">
      <div class="lines-spinner"></div>
      <span>A carregar paragens&hellip;</span>
    </div>

    <div id="line-detail-error" class="lines-error" style="display:none">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/>
      </svg>
      <span id="line-detail-error-msg">Erro ao carregar paragens.</span>
    </div>

    <ol id="line-stops-list" class="line-stops-list" aria-label="Paragens da linha" style="display:none"></ol>

    <footer class="lines-footer">
      &copy; 2026 STCP Live Map &bull; Website feito com &#x1F90D; por <a href="https://www.tiagoanoliveira.pt/" target="_blank" rel="noopener noreferrer">Tiago Oliveira</a>
    </footer>
  </div>

  <script type="module" src="./src/pages/LineDetailApp.js"></script>
</body>
</html>
