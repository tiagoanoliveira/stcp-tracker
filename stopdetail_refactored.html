<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STCP Tracker - Paragem</title>
  <link rel="shortcut icon" href="./resources/favicon.svg">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- StopDetail CSS -->
  <link rel="stylesheet" href="./src/ui/styles/stopdetail.css" />
</head>
<body>
  <!-- Header -->
  <header class="header-overlay">
    <div class="header-content">
      <div class="header-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <h1 id="stop-title">Paragem STCP</h1>
      </div>
      <div class="header-actions">
        <a href="stopsmap_refactored.html" class="header-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Mapa de Paragens
        </a>
        <a href="busmap_refactored.html" class="header-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="6" width="18" height="12" rx="2"/>
            <path d="M7 10h.01M12 10h.01M17 10h.01"/>
          </svg>
          Mapa de Autocarros
        </a>
      </div>
    </div>
  </header>

  <!-- Mensagem de erro (escondida por padrão) -->
  <div id="error-message" class="error-overlay"></div>

  <!-- Container principal com grid 2 colunas -->
  <div class="container">
    <!-- Card de chegadas -->
    <div class="card">
      <div class="card-header">
        <h2>Próximas Chegadas</h2>
        <button id="refresh-now" class="refresh-btn" title="Atualizar" onclick="window.location.reload()">↺</button>
      </div>
      <div id="arrivals-list" class="arrivals-container">
        <p class="no-arrivals">A carregar informações...</p>
      </div>
      <div class="card-footer">
        <p id="last-update-time">Última atualização: <strong>--:--:--</strong></p>
      </div>
    </div>

    <!-- Card do mapa -->
    <div class="card map-card">
      <div class="card-header">
        <h2>Localização dos Autocarros</h2>
      </div>
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Nossa aplicação refatorizada -->
  <script type="module" src="./src/pages/StopDetailApp.js"></script>
</body>
</html>
