<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mapa em tempo real dos autocarros STCP no Porto">
  <meta name="theme-color" content="#0072c6">
  <title>STCP Tracker - Mapa de Autocarros</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./src/ui/styles/busmap.css">
  <link rel="stylesheet" href="./src/ui/styles/loading.css">
  <link rel="stylesheet" href="./src/ui/styles/routeFilterBar.css">
  <link rel="stylesheet" href="./src/ui/styles/filterRow.css">
  
  <link rel="shortcut icon" href="./resources/favicon.svg">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BYVRR1K1R2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BYVRR1K1R2');
  </script>
</head>
<body>
  <div id="map"></div>

  <a href="/" class="logo-overlay" title="Recarregar página">
    <img src="./resources/favicon.svg" alt="STCP Live Map Logo">
    <span class="logo-text">STCP Live</span>
  </a>

  <div class="header-overlay">
    <div id="last-update-time" class="header-timestamp">
      Última atualização: <strong>--:--:--</strong>
    </div>
    <button id="refresh-now" class="header-btn" title="Atualizar dados">
      <img src="./resources/atualizar.png" alt="Atualizar">
    </button>
  </div>

  <!-- Pill de filtro de linhas — independente, abaixo do header-overlay -->
  <div id="filter-row" class="busmap-filter-row">
    <div id="route-filter-bar"></div>
  </div>

  <div class="footer-overlay">
    &copy; 2026 STCP Live Map • Website feito com 🤍 por <a href="https://www.tiagoanoliveira.pt/" target="_blank">Tiago Oliveira</a>. Dificuldades ou sugestões?
    <a href="https://tiagoanoliveira.pt/support/a260e7bee11b401b9fd09290e8a8d6d9">Clica aqui.</a>
  </div>

  <div id="error-message" class="error-overlay"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./src/pages/BusMapApp.js"></script>
</body>
</html>
